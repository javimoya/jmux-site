<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jmux — el terminal donde tus agentes no se pierden</title>
<meta name="description" content="jmux: terminal nativo para macOS hecho para Claude Code y Codex. Sesiones que sobreviven a todo, agentes que se ven, se hablan y se reparten el trabajo, y búsqueda en todas tus conversaciones.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141619'/%3E%3Cpath d='M16 20l12 12-12 12' stroke='%2340C786' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='36' y='20' width='10' height='24' rx='2' fill='%23E6E8EB'/%3E%3C/svg%3E">
<script>
  // Theme and language before first paint: no flash of the wrong one.
  (function () {
    var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var t = ls("jmux.site.theme") || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.themePref = t;
    var l = ls("jmux.site.lang") || ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
    document.documentElement.lang = l;
  })();
</script>
<style>
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }

/* jmux's own palette (app/Sources/JmuxApp/Theme.swift), dark and light. */
:root, [data-theme="dark"] {
  --bg: #141619; --bg-side: #16171a; --raised: #1a1c1f; --term: #0f1113;
  --hover: rgba(255,255,255,.045); --active: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
  --text: #e6e8eb; --text-mid: #a2a5a8; --text-dim: #6f7275; --text-faint: #4b4d50;
  --accent: #40c786; --accent-soft: rgba(64,199,134,.14); --accent-line: rgba(64,199,134,.5);
  --green: #5bd295; --yellow: #e5c057; --red: #f17070; --blue: #60aaf3; --magenta: #cf8fde; --cyan: #62c8df;
  --claude: #d97757; --codex: #6b78eb;
  --glow: rgba(64,199,134,.10);
  --shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
}
[data-theme="light"] {
  --bg: #ffffff; --bg-side: #fbfbfc; --raised: #ffffff; --term: #f7f8f9;
  --hover: rgba(0,0,0,.04); --active: rgba(0,0,0,.06);
  --border: rgba(0,0,0,.10); --border-strong: rgba(0,0,0,.16);
  --text: #27292d; --text-mid: #53555a; --text-dim: #777a7f; --text-faint: #96989c;
  --accent: #4ba3f7; --accent-soft: rgba(75,163,247,.14); --accent-line: rgba(75,163,247,.5);
  --green: #009259; --yellow: #b37903; --red: #c8393a; --blue: #1f74bf; --magenta: #9750a7; --cyan: #1e7ca1;
  --glow: rgba(75,163,247,.10);
  --shadow: 0 30px 70px rgba(20,30,50,.18), 0 0 0 1px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono, code, kbd, pre, .kicker { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: inherit; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ── top bar ─────────────────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 50; height: 56px;
  display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: .02em; }
.brand svg { width: 26px; height: 26px; }
.brand .sub { color: var(--text-dim); font-weight: 400; font-size: 12px; }
.top nav { display: flex; gap: 4px; margin-left: 8px; }
.top nav a { text-decoration: none; color: var(--text-mid); font-size: 14px; padding: 6px 10px; border-radius: 8px; }
.top nav a:hover { background: var(--hover); color: var(--text); }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { all: unset; cursor: pointer; font: 12px/1 "JetBrains Mono", monospace; color: var(--text-dim); padding: 6px 8px; border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--text); }
.seg button:hover { color: var(--text); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
  font: 600 14px/1 -apple-system, system-ui, sans-serif; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--raised); color: var(--text);
}
.btn:hover { border-color: var(--accent-line); }
.btn.primary { background: var(--accent); color: #07140d; border-color: transparent; }
[data-theme="light"] .btn.primary { color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.lg { padding: 13px 18px; font-size: 15px; border-radius: 12px; }

/* ── hero ────────────────────────────────────────────────── */
.hero { position: relative; overflow: hidden; padding: 72px 22px 40px; }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(900px 420px at 18% -10%, var(--glow), transparent 70%),
    linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0 / 44px 44px;
  mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
  opacity: .55;
}
.wrap { max-width: 1240px; margin: 0 auto; position: relative; }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.eyebrow { font: 13px/1 "JetBrains Mono", monospace; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
.eyebrow .cursor { width: 8px; height: 15px; background: var(--accent); display: inline-block; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h1 { font-size: clamp(42px, 6.4vw, 86px); line-height: 1.0; letter-spacing: -.04em; margin: 18px 0 26px; font-weight: 700; max-width: 14.5em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: 19px; color: var(--text-mid); max-width: 38em; margin: 0; }
.hero-side { display: flex; flex-direction: column; gap: 14px; }
.install {
  display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px;
  background: var(--term); border: 1px solid var(--border-strong); border-radius: 12px; font-size: 13.5px;
}
.install code { flex: 1; overflow-x: auto; white-space: nowrap; color: var(--text); }
.install code::before { content: "$ "; color: var(--accent); }
.hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; }
.meta-line { font: 12px/1.5 "JetBrains Mono", monospace; color: var(--text-dim); }
.meta-line b { color: var(--text-mid); font-weight: 400; }

.shot-hero { margin: 48px auto 0; position: relative; max-width: 1240px; }
.window { position: relative; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--term); }
.window img { display: block; width: 100%; height: auto; }
.pin { text-decoration: none;
  position: absolute; transform: translate(-50%, -50%); z-index: 2;
  width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: #07140d; font: 600 12px/26px "JetBrains Mono", monospace; text-align: center;
  box-shadow: 0 0 0 5px var(--accent-soft), 0 6px 18px rgba(0,0,0,.4);
  animation: pulse 2.4s ease-in-out infinite;
}
[data-theme="light"] .pin { color: #fff; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 5px var(--accent-soft), 0 6px 18px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 10px transparent, 0 6px 18px rgba(0,0,0,.4); } }
.pin .tip {
  position: absolute; left: 50%; top: 34px; transform: translateX(-50%); width: max-content; max-width: 260px;
  background: var(--raised); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 10px 12px; font: 13px/1.45 -apple-system, system-ui, sans-serif; text-align: left;
  box-shadow: 0 12px 40px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
}
.pin .tip b { display: block; font-weight: 600; margin-bottom: 2px; }
.pin .tip span { color: var(--accent); font-family: "JetBrains Mono", monospace; font-size: 12px; }
.pin:hover .tip, .pin:focus-visible .tip { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(2px); }
.pin.flip .tip { top: auto; bottom: 34px; }
.pin.left .tip { left: 0; transform: none; }
.pin.right .tip { left: auto; right: 0; transform: none; }
.hero-caption { text-align: center; color: var(--text-dim); font-size: 13px; margin-top: 14px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin: 44px 0 0; }
.stat { background: var(--bg); padding: 20px 22px; }
.stat .n { font: 600 30px/1.1 "JetBrains Mono", monospace; letter-spacing: -.02em; }
.stat .n small { font-size: 16px; color: var(--text-mid); font-weight: 400; }
.stat .d { color: var(--text-mid); font-size: 14px; margin-top: 6px; }
.stat .s { color: var(--text-faint); font: 11px/1.4 "JetBrains Mono", monospace; margin-top: 8px; }

/* ── paths (pick what you came for) ──────────────────────── */
.paths { padding: 56px 22px 8px; }
.paths h2 { font-size: 15px; font-weight: 500; color: var(--text-dim); margin: 0 0 14px; font-family: "JetBrains Mono", monospace; }
.path-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.path {
  all: unset; cursor: pointer; display: block; padding: 16px 18px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--raised); transition: border-color .15s, transform .15s;
}
.path:hover { border-color: var(--accent-line); transform: translateY(-2px); }
.path[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.path b { display: block; font-size: 15px; margin-bottom: 4px; }
.path span { color: var(--text-mid); font-size: 13.5px; line-height: 1.45; display: block; }
.path i { font-style: normal; font: 11px/1 "JetBrains Mono", monospace; color: var(--accent); display: block; margin-bottom: 10px; }

/* ── the tour: rail + features ───────────────────────────── */
.tour { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 44px; padding: 30px 22px 80px; max-width: 1284px; margin: 0 auto; }
.rail {
  position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 88px);
  display: flex; flex-direction: column; background: var(--bg-side); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
}
.rail-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); font: 11px/1 "JetBrains Mono", monospace; letter-spacing: .12em; color: var(--text-dim); }
.rail-head .count { margin-left: auto; letter-spacing: 0; color: var(--text-faint); }
.filter { position: relative; padding: 10px 10px 6px; }
.filter input {
  width: 100%; font: 13px/1 "JetBrains Mono", monospace; color: var(--text); background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 9px 30px 9px 30px; outline: none;
}
.filter input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.filter svg { position: absolute; left: 20px; top: 20px; width: 13px; height: 13px; color: var(--text-dim); }
.filter kbd { position: absolute; right: 18px; top: 17px; }
.tree { overflow-y: auto; padding: 4px 6px 8px; flex: 1; scrollbar-width: thin; }
.tree .proj { display: flex; align-items: center; gap: 8px; padding: 7px 8px 5px; font: 600 12.5px/1.2 "JetBrains Mono", monospace; color: var(--text); cursor: pointer; border-radius: 7px; text-decoration: none; }
.tree .proj:hover { background: var(--hover); }
.tree .proj svg { width: 14px; height: 14px; color: var(--text-dim); flex: none; }
.tree a.row { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 22px; border-radius: 7px; text-decoration: none; color: var(--text-mid); font: 12.5px/1.25 "JetBrains Mono", monospace; position: relative; }
.tree a.row:hover { background: var(--hover); color: var(--text); }
.tree a.row.current { background: var(--active); color: var(--text); }
.tree a.row.current::before { content: ""; position: absolute; left: 4px; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--accent); }
.tree a.row svg { width: 13px; height: 13px; flex: none; }
.tree a.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: transparent; }
.dot.unseen { background: var(--magenta); }
.dot.working { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); animation: breathe 1.6s ease-in-out infinite; }
.dot.open { background: var(--yellow); }
.dot.new { background: var(--accent); border-radius: 2px; transform: rotate(45deg); }
@keyframes breathe { 50% { opacity: .45; } }
.k-claude { color: var(--claude); } .k-codex { color: var(--codex); } .k-term, .k-doc, .k-mac, .k-search { color: var(--text-dim); }
.rail-foot { border-top: 1px solid var(--border); padding: 6px 8px 8px; }
.counter { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; font: 12px/1.3 "JetBrains Mono", monospace; color: var(--text-dim); }
.counter:hover { background: var(--hover); color: var(--text); }
.counter[aria-pressed="true"] { background: var(--active); color: var(--text); }
.counter .n { margin-left: auto; }
.rail-hint { font: 11px/1.4 "JetBrains Mono", monospace; color: var(--text-faint); padding: 6px 6px 0; }
.empty { display: none; padding: 40px 0; color: var(--text-dim); }

.group-head { padding: 26px 0 6px; margin-top: 30px; border-top: 1px solid var(--border); }
.group-head:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.group-head .kicker { color: var(--accent); font-size: 12.5px; margin: 0; }
.group-head h2 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -.03em; line-height: 1.08; margin: 10px 0 8px; }
.group-head p { color: var(--text-mid); font-size: 17px; max-width: 44em; margin: 0; }

.feat { padding: 38px 0 6px; scroll-margin-top: 76px; }
.feat + .feat { border-top: 1px dashed var(--border); }
.feat-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.feat .kicker { font-size: 12px; color: var(--text-dim); margin: 0 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.badge { font: 11px/1 "JetBrains Mono", monospace; padding: 4px 7px; border-radius: 99px; border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.badge.warn { border-color: color-mix(in srgb, var(--yellow) 50%, transparent); color: var(--yellow); background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.feat h3 { font-size: clamp(23px, 2.3vw, 30px); letter-spacing: -.022em; line-height: 1.15; margin: 0 0 10px; }
.feat .lede { color: var(--text-mid); font-size: 16.5px; max-width: 46em; margin: 0; }
.feat .lede b { color: var(--text); font-weight: 600; }
.anchor { all: unset; cursor: pointer; font: 12px/1 "JetBrains Mono", monospace; color: var(--text-faint); padding: 6px 8px; border-radius: 7px; border: 1px solid transparent; white-space: nowrap; }
.anchor:hover { color: var(--text); border-color: var(--border); }
.how { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.how li { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-mid); background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.how li code { color: var(--text); font-size: 12.5px; }
kbd {
  display: inline-block; min-width: 20px; text-align: center; font-size: 12px; line-height: 18px; padding: 0 5px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px;
}
.how li .plus { color: var(--text-faint); font-size: 11px; }

figure { margin: 22px 0 0; }
.frame { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-strong); background: var(--term); cursor: zoom-in; position: relative; }
.frame img { display: block; width: 100%; height: auto; }
.frame.narrow { max-width: 420px; }
.frame.mid { max-width: 680px; }
.frame.strip { max-width: 560px; }
.frame.tband { position: relative; }
.ring { position: absolute; top: 50%; height: 80%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 2.4s ease-in-out infinite; pointer-events: none; }
figcaption { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

.term { background: var(--term); border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; margin: 22px 0 0; }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--border); font: 11.5px/1 "JetBrains Mono", monospace; color: var(--text-dim); }
.term-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
.term-bar span { margin-left: 8px; }
.term pre { margin: 0; padding: 14px 16px; font-size: 12.8px; line-height: 1.55; overflow-x: auto; color: var(--text); }
.term .p { color: var(--accent); user-select: none; }
.term .o { color: var(--text-mid); }
.term .h { color: var(--green); }
.term .y { color: var(--yellow); }
.term .m { color: var(--magenta); }
.term .c { color: var(--claude); }
.term .x { color: var(--codex); }
.term .d { color: var(--text-dim); }

/* the expandable example */
details.ex { margin: 20px 0 0; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); overflow: hidden; }
details.ex[open] { border-color: var(--accent-line); }
details.ex summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-weight: 600; font-size: 14.5px; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary .chev { width: 16px; height: 16px; color: var(--accent); transition: transform .18s; flex: none; }
details.ex[open] summary .chev { transform: rotate(90deg); }
details.ex summary .n { margin-left: auto; font: 12px/1 "JetBrains Mono", monospace; color: var(--text-dim); font-weight: 400; }
details.ex summary:hover { background: var(--hover); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 4px 16px 16px; }
.steps > li { counter-increment: s; position: relative; padding: 12px 0 4px 40px; }
.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: 11px; width: 24px; height: 24px; border-radius: 50%;
  font: 600 12px/24px "JetBrains Mono", monospace; text-align: center; color: var(--accent); background: var(--accent-soft);
}
.steps > li + li { border-top: 1px dashed var(--border); }
.steps p { margin: 0 0 8px; font-size: 15px; }
.steps p code { font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.cmd { display: flex; align-items: flex-start; gap: 8px; background: var(--term); border: 1px solid var(--border); border-radius: 9px; padding: 9px 9px 9px 12px; margin: 6px 0 0; }
.cmd pre { flex: 1; margin: 0; font-size: 12.8px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.cmd pre::before { content: "$ "; color: var(--accent); user-select: none; }
.cmd.plain pre::before { content: ""; }
.out { margin: 6px 0 0; padding: 10px 12px; border-left: 2px solid var(--border-strong); font-size: 12.3px; line-height: 1.5; color: var(--text-mid); white-space: pre-wrap; word-break: break-word; background: color-mix(in srgb, var(--term) 60%, transparent); border-radius: 0 8px 8px 0; max-height: 360px; overflow: auto; }
.copy { all: unset; cursor: pointer; flex: none; font: 11px/1 "JetBrains Mono", monospace; color: var(--text-dim); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
.copy:hover { color: var(--text); border-color: var(--border-strong); }
.copy.ok { color: var(--accent); border-color: var(--accent-line); }
.steps .keys { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }

/* honest section, install, footer */
.band { padding: 70px 22px; border-top: 1px solid var(--border); }
.band h2 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -.03em; margin: 8px 0 10px; line-height: 1.08; }
.band .kicker { color: var(--accent); font-size: 12.5px; margin: 0; }
.band .lede { color: var(--text-mid); font-size: 17px; max-width: 46em; margin: 0 0 28px; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { background: var(--raised); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
.card h4 { margin: 0 0 8px; font-size: 16px; }
.card p, .card li { color: var(--text-mid); font-size: 14.5px; margin: 0; }
.card ul { margin: 0; padding-left: 18px; }
.card li + li { margin-top: 6px; }
.card .tag { font: 11px/1 "JetBrains Mono", monospace; color: var(--text-dim); display: block; margin-bottom: 10px; }
.install-steps { max-width: 820px; }
.foot { border-top: 1px solid var(--border); padding: 30px 22px 50px; color: var(--text-dim); font-size: 13px; }
.foot .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.foot a { color: var(--text-mid); }

/* lightbox, chord labels, toast */
.lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(5,7,9,.86); display: none; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; backdrop-filter: blur(4px); }
.lightbox.on { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 30px 100px rgba(0,0,0,.6); }
.lightbox p { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #a2a5a8; font-size: 13px; margin: 0; }
.chord {
  position: absolute; z-index: 60; transform: translate(-50%, -115%); pointer-events: none;
  font: 600 11px/1 "JetBrains Mono", monospace; color: #07140d; background: var(--accent); padding: 4px 6px; border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
[data-theme="light"] .chord { color: #fff; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 120; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 14px; font: 12.5px/1.2 "JetBrains Mono", monospace; transition: .18s; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.on { opacity: 1; transform: translateX(-50%); }
.keys-help { position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center; background: rgba(5,7,9,.6); }
.keys-help.on { display: flex; }
.keys-help .card { width: min(440px, 92vw); }
.keys-help table { width: 100%; border-collapse: collapse; font-size: 14px; }
.keys-help td { padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text-mid); }
.keys-help td:first-child { width: 90px; }

.hidden { display: none !important; }
.seg button:focus-visible, .path:focus-visible, .counter:focus-visible, .anchor:focus-visible, .copy:focus-visible, .pin:focus-visible, .frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero-grid > *, .tour > *, .hero-side, .install { min-width: 0; }
html, body { overflow-x: clip; }

@media (max-width: 1080px) {
  .hero-grid { grid-template-columns: 1fr; gap: 26px; }
  .tour { grid-template-columns: 1fr; }
  .rail { position: relative; top: 0; max-height: 420px; }
  .path-grid, .stats { grid-template-columns: repeat(2, 1fr); }
  .cols { grid-template-columns: 1fr; }
  .top nav { display: none; }
}
@media (max-width: 640px) {
  .duo { grid-template-columns: 1fr; }
  .path-grid, .stats { grid-template-columns: 1fr; }
  .pin { width: 20px; height: 20px; line-height: 20px; font-size: 10px; }
  .top .brand .sub, .top .seg.lang-seg { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#top" aria-label="jmux">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#141619"/><path d="M16 20l12 12-12 12" stroke="#40C786" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="20" width="10" height="24" rx="2" fill="#E6E8EB"/></svg>
    <span>jmux</span><span class="sub mono">terminal · agents</span>
  </a>
  <nav aria-label="sections">
    <a href="#tour" data-i="nav.features"></a>
    <a href="#perf" data-i="nav.perf"></a>
    <a href="#honest" data-i="nav.honest"></a>
    <a href="#install" data-i="nav.install"></a>
  </nav>
  <div class="spacer"></div>
  <div class="seg lang-seg" role="group" aria-label="language" data-chord="L">
    <button data-lang="es">ES</button><button data-lang="en">EN</button>
  </div>
  <div class="seg" role="group" aria-label="theme" data-chord="T">
    <button data-themepref="dark" title="Dark">☾</button><button data-themepref="system" title="System">◐</button><button data-themepref="light" title="Light">☀</button>
  </div>
  <a class="btn primary" href="#install" data-i="cta.install"></a>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <span class="eyebrow" data-i-html="hero.eyebrow"></span>
      <h1 data-i-html="hero.title"></h1>
      <div class="hero-grid">
        <div>
          <p class="lede" data-i-html="hero.lede"></p>
        </div>
        <div class="hero-side">
          <div class="install mono"><code id="hero-cmd">gh release download --repo javimoya/jmux --pattern 'jmux-*-macos-arm64.zip'</code><button class="copy" data-copy="#hero-cmd" data-i="copy"></button></div>
          <div class="hero-ctas">
            <a class="btn primary lg" href="#install" data-i="cta.install2"></a>
            <a class="btn lg" href="#tour" data-i="cta.tour"></a>
          </div>
          <div class="meta-line" data-i-html="hero.meta"></div>
        </div>
      </div>

      <div class="shot-hero">
        <div class="window" id="hero-window">
          <img id="hero-img" src="shots/hero-dark.webp" width="2000" height="1249" alt="" data-dark="shots/hero-dark.webp" data-light="shots/hero-light.webp" data-i-alt="hero.alt">
        </div>
        <p class="hero-caption" data-i="hero.caption"></p>
      </div>

      <div class="stats" id="perf">
        <div class="stat"><div class="n"><span data-i="stat.key.n"></span><small> ms</small></div><div class="d" data-i="stat.key"></div><div class="s">p50 · ADR-0003</div></div>
        <div class="stat"><div class="n">204<small> ms</small></div><div class="d" data-i="stat.reattach"></div><div class="s" data-i="stat.reattach.s"></div></div>
        <div class="stat"><div class="n">0<small data-i="stat.frames.n"></small></div><div class="d" data-i="stat.frames"></div><div class="s" data-i="stat.frames.s"></div></div>
        <div class="stat"><div class="n">2<small> + ∞</small></div><div class="d" data-i="stat.agents"></div><div class="s" data-i="stat.agents.s"></div></div>
      </div>
    </div>
  </section>

  <section class="paths">
    <div class="wrap">
      <h2 data-i="paths.title"></h2>
      <div class="path-grid" id="paths"></div>
    </div>
  </section>

  <section class="tour" id="tour">
    <aside class="rail" aria-label="features">
      <div class="rail-head"><span>PROJECTS</span><span class="count mono" id="count"></span></div>
      <div class="filter" data-chord="/">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Filter features">
        <kbd>/</kbd>
      </div>
      <nav class="tree" id="tree"></nav>
      <div class="rail-foot">
        <button class="counter" data-filter="new"><span class="dot new"></span><span data-i="c.new"></span><span class="n" id="n-new">0</span></button>
        <button class="counter" data-filter="open"><span class="dot open"></span><span data-i="c.open"></span><span class="n" id="n-open">0</span></button>
        <button class="counter" data-filter="unseen"><span class="dot unseen"></span><span data-i="c.unseen"></span><span class="n" id="n-unseen">0</span></button>
        <div class="rail-hint" data-i-html="c.hint"></div>
      </div>
    </aside>
    <div id="features"></div>
  </section>

  <section class="band" id="honest">
    <div class="wrap">
      <p class="kicker mono" data-i="honest.kicker"></p>
      <h2 data-i="honest.title"></h2>
      <p class="lede" data-i="honest.lede"></p>
      <div class="cols" id="honest-cols"></div>
    </div>
  </section>

  <section class="band" id="install">
    <div class="wrap install-steps">
      <p class="kicker mono" data-i="install.kicker"></p>
      <h2 data-i="install.title"></h2>
      <p class="lede" data-i="install.lede"></p>
      <div id="install-body"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <span class="mono">jmux</span>
    <span data-i-html="foot.made"></span>
    <span style="margin-left:auto" data-i-html="foot.credits"></span>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoom"><img alt=""><p></p></div>
<div class="toast mono" id="toast"></div>
<div class="keys-help" id="keys-help" role="dialog" aria-modal="true" aria-label="Shortcuts"><div class="card"><h4 data-i="keys.title"></h4><table id="keys-table"></table></div></div>

<script src="site.js"></script>
</body>
</html>
